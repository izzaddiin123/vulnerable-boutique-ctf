version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: website-database-1
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: boutique_db
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

  flask_app:
    build: ./flask_backend
    container_name: website-flask_app-1
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=boutique_db
    depends_on:
      - database

  php_app:
    build: ./php_legacy
    container_name: website-php_app-1
    volumes:
      - ./php_legacy:/var/www/html
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: website-frontend-1
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    container_name: website-nginx-1
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - flask_app
      - php_app