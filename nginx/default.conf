server {
    listen 80;

    # 1. Frontend (React / Vite)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # 2. Flask API Subsystem
    # Note the trailing slash on http://flask_app:5000/
    # This strips '/api' so /api/products reaches Flask as /products
    location /api/ {
        proxy_pass http://flask_app:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. PHP Legacy Subsystem
    # Note the trailing slash on http://php_app:80/
    location /legacy/ {
        proxy_pass http://php_app:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
